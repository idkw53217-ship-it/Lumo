<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Lumo Studio — Photo & video editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Caveat:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400;1,700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=DM+Serif+Display:ital@0;1&family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=Instrument+Sans:wght@400;500;600;700&family=Lobster&family=Montserrat:wght@400;700&family=Oswald:wght@400;700&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#050505;--bg1:#0b0b0c;--bg2:#111113;--bg3:#1a1a1d;--bg4:#242428;
  --line:#222226;--line2:#34343a;
  --tx:#ecebe8;--tx2:#a4a3a9;--tx3:#6e6d74;
  --ac:#dc143c;--ac2:#f2506e;--acd:#dc143c;--acbg:rgba(220,20,60,.16);
  --paper:#000;--paper2:#121214;--card:#0b0b0c;--ink:#f3f1ee;--ink2:#a3a2a8;--ink3:#6f6e75;--pline:#242428;
  --ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Fraunces','Playfair Display',Georgia,serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font:13px/1.4 var(--ui);color:var(--tx);background:var(--bg0);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.ic{display:block;flex:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:10px;border:3px solid transparent;background-clip:content-box}::-webkit-scrollbar-thumb:hover{background:var(--line2);background-clip:content-box;border:3px solid transparent}
.hide{display:none!important}

/* ---------- views ---------- */
#home,#editor{position:absolute;inset:0;transition:opacity .35s var(--ease),transform .35s var(--ease)}
body.view-home #editor{opacity:0;pointer-events:none;transform:scale(.99);visibility:hidden}
body.view-editor #home{opacity:0;pointer-events:none;transform:scale(1.01);visibility:hidden}
#editor{display:flex;flex-direction:column;background:var(--bg0)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 12px;border-radius:6px;background:var(--bg3);border:1px solid var(--line);font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s,transform .12s,color .15s}
.btn:hover{background:var(--bg4);border-color:var(--line2)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--ac2);border-color:var(--ac2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--bg3)}
.btn.ico{width:32px;padding:0}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.blk{width:100%}
.btn[disabled],.btn.dis{opacity:.35;pointer-events:none}
.btn.on{background:var(--acbg);border-color:var(--ac);color:var(--ac2)}
.inp{height:30px;padding:0 9px;border-radius:6px;background:var(--bg0);border:1px solid var(--line);outline:0;width:100%;transition:border-color .15s;user-select:text;-webkit-user-select:text}
.inp:focus{border-color:var(--ac)}
textarea.inp{height:auto;padding:8px 9px;resize:vertical;min-height:64px;line-height:1.4}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' fill='none' stroke='%23a4a3a9' stroke-width='1.6'><path d='M1 1l4 4 4-4'/></svg>");background-repeat:no-repeat;background-position:right 9px center;padding-right:26px}
.row{display:flex;align-items:center;gap:8px}.row>*{min-width:0}.grow{flex:1}
.col{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:11px;color:var(--tx2);letter-spacing:.02em}
.mut{color:var(--tx2)}.sm-t{font-size:11.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg{display:flex;background:var(--bg0);border:1px solid var(--line);border-radius:6px;padding:2px;gap:2px}
.seg button{flex:1;height:24px;border-radius:4px;color:var(--tx2);font-size:12px;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.seg button:hover{color:var(--tx)}.seg button.on{background:var(--bg4);color:var(--tx)}
.tog{width:34px;height:20px;border-radius:20px;background:var(--bg4);position:relative;flex:none;transition:background .2s}
.tog::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#ddd;transition:transform .2s var(--ease),background .2s}
.tog.on{background:var(--ac)}.tog.on::after{transform:translateX(14px);background:#fff}
.chip{height:26px;padding:0 11px;border-radius:20px;border:1px solid var(--line);color:var(--tx2);font-size:12px;white-space:nowrap;transition:all .15s;flex:none}
.chip:hover{color:var(--tx);border-color:var(--line2)}.chip.on{background:var(--tx);color:var(--bg0);border-color:var(--tx)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}

/* slider */
.sl{display:flex;flex-direction:column;gap:5px}
.sl-top{display:flex;justify-content:space-between;align-items:center}
.sl-top label{font-size:12px;color:var(--tx2);cursor:default}
.sl-val{width:44px;height:20px;background:transparent;border:1px solid transparent;border-radius:4px;text-align:right;font-size:12px;color:var(--tx);outline:0;font-variant-numeric:tabular-nums;user-select:text}
.sl-val:hover{border-color:var(--line)}.sl-val:focus{border-color:var(--ac);background:var(--bg0)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;outline:0;cursor:pointer;--p:50%;--z:0%}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(to right,var(--line2) 0 min(var(--z),var(--p)),var(--ac) min(var(--z),var(--p)) max(var(--z),var(--p)),var(--line2) max(var(--z),var(--p)) 100%)}
input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:var(--line2)}
input[type=range]::-moz-range-progress{height:3px;background:var(--ac)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#f4f2ee;margin-top:-5.5px;box-shadow:0 1px 4px rgba(0,0,0,.5);transition:transform .15s var(--ease),box-shadow .15s}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#f4f2ee;box-shadow:0 1px 4px rgba(0,0,0,.5)}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.12)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25);box-shadow:0 0 0 5px var(--acbg),0 1px 4px rgba(0,0,0,.5)}
/* colour field */
.cf{display:flex;align-items:center;gap:8px}.cf-l{flex:1;font-size:12px;color:var(--tx2)}
.cf .sw{width:28px;height:28px;border-radius:6px;border:1px solid var(--line2);position:relative;overflow:hidden;flex:none;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.cf .sw input{position:absolute;inset:-6px;opacity:0;width:44px;height:44px;cursor:pointer}
.cf .hex{width:78px;height:28px;font-size:12px;text-transform:uppercase;font-variant-numeric:tabular-nums}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.swatches button{aspect-ratio:1;border-radius:5px;border:1px solid rgba(255,255,255,.1);transition:transform .15s var(--ease)}
.swatches button:hover{transform:scale(1.14)}
.swatches button.on{outline:2px solid var(--ac);outline-offset:1px}
/* groups */
.grp{border-bottom:1px solid var(--line)}
.grp-h{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 16px;font-weight:600;font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:var(--tx2);transition:color .15s}
.grp-h:hover{color:var(--tx)}.grp-h .ic{transition:transform .25s var(--ease)}
.grp.shut .grp-h .ic{transform:rotate(-90deg)}
.grp-b{display:grid;grid-template-rows:1fr;transition:grid-template-rows .28s var(--ease)}
.grp.shut .grp-b{grid-template-rows:0fr}
.grp-b>div{overflow:hidden;min-height:0}
.grp-in{padding:2px 16px 16px;display:flex;flex-direction:column;gap:12px}
.pad{padding:16px}.pad-s{padding:12px 16px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:34px 20px;color:var(--tx2)}
.empty svg.big{color:var(--tx3)}.empty b{color:var(--tx);font-weight:600;font-size:13px}
.hr{height:1px;background:var(--line);margin:2px 0}
.note{font-size:11.5px;color:var(--tx3);line-height:1.45}

/* ---------- top bar ---------- */
.topbar{height:52px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--bg1);border-bottom:1px solid var(--line);position:relative;z-index:30}
.logo{display:flex;align-items:center;gap:9px;height:36px;padding:0 8px 0 4px;border-radius:6px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.logo:hover{background:var(--bg3)}
.logo svg{flex:none}
.vsep{width:1px;height:22px;background:var(--line);margin:0 6px}
.pname{background:transparent;border:1px solid transparent;border-radius:6px;height:32px;padding:0 9px;width:200px;font-weight:500;outline:0;text-overflow:ellipsis;user-select:text}
.pname:hover{border-color:var(--line)}.pname:focus{border-color:var(--ac);background:var(--bg0)}
.status{font-size:11.5px;color:var(--tx3);display:flex;align-items:center;gap:6px;min-width:70px}
.status i{width:6px;height:6px;border-radius:50%;background:#58c27d;transition:background .2s}.status.dirty i{background:var(--ac)}
.sp{flex:1}
.tb-r{display:flex;align-items:center;gap:6px}

/* ---------- workarea ---------- */
.work{flex:1;display:flex;min-height:0;position:relative}
.rail{width:76px;flex:none;background:var(--bg1);border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;position:relative;display:flex;flex-direction:column;padding:6px 0;scrollbar-width:none;z-index:20}
.rail::-webkit-scrollbar{display:none}
.rail-ind{position:absolute;left:0;top:0;width:3px;height:36px;background:var(--ac);border-radius:0 3px 3px 0;transition:transform .3s var(--ease),opacity .2s;opacity:0}
.rail-i{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;margin:1px 6px;border-radius:8px;color:var(--tx2);font-size:10.5px;font-weight:500;transition:background .15s,color .15s;flex:none;position:relative}
.rail-i:hover{background:var(--bg3);color:var(--tx)}
.rail-i.on{background:var(--bg3);color:var(--tx)}
.rail-i.on .ic{color:var(--ac2);animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.5px)}}
.rail-sep{height:1px;background:var(--line);margin:3px 14px;flex:none}
.panel{width:312px;flex:none;background:var(--bg2);border-right:1px solid var(--line);overflow:hidden;transition:width .3s var(--ease),border-color .3s;position:relative;z-index:15}
.panel.shut{width:0;border-right-color:transparent}
.panel-in{width:312px;height:100%;display:flex;flex-direction:column}
.panel-h{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;font-weight:600;font-size:14px;border-bottom:1px solid var(--line)}
.panel-b{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}
.panel-b.enter>*{animation:slidein .28s var(--ease) both}
@keyframes slidein{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.stage{flex:1;position:relative;overflow:hidden;background:#000;min-width:0;touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:0}
.stage.drop::after{content:'Drop images to add them';position:absolute;inset:14px;border:2px dashed var(--ac);border-radius:12px;background:rgba(220,20,60,.08);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:var(--ac2);pointer-events:none;animation:pop .2s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.98)}}
.ctxbar{position:absolute;top:12px;left:50%;transform:translate(-50%,-8px);display:flex;gap:2px;padding:4px;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s var(--ease);z-index:5;max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
.ctxbar.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.ctxbar .vs{width:1px;background:var(--line);margin:4px 3px}
.zoombar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:3px;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:5}
.zoombar .zv{width:52px;text-align:center;font-variant-numeric:tabular-nums;font-size:12px;height:30px;border-radius:6px}.zoombar .zv:hover{background:var(--bg3)}
.stage .hint{position:absolute;left:14px;bottom:18px;font-size:11.5px;color:var(--tx3);pointer-events:none}
.stage .dim{position:absolute;right:14px;bottom:18px;font-size:11.5px;color:var(--tx3);pointer-events:none;font-variant-numeric:tabular-nums}
.props{width:292px;flex:none;background:var(--bg2);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:15}
.props-h{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:600;font-size:14px;border-bottom:1px solid var(--line)}
.props-h small{font-weight:500;color:var(--tx3);font-size:11.5px;text-transform:capitalize}
.props-b{flex:1;overflow-y:auto;overflow-x:hidden}
.nf{display:flex;align-items:center;height:30px;background:var(--bg0);border:1px solid var(--line);border-radius:6px;padding:0 8px;gap:6px;transition:border-color .15s}
.nf:focus-within{border-color:var(--ac)}.nf span{font-size:11px;color:var(--tx3);width:12px}
.nf input{background:transparent;border:0;outline:0;width:100%;min-width:0;font-variant-numeric:tabular-nums;font-size:12.5px;user-select:text}
.ibtns{display:flex;gap:4px}.ibtns .btn{flex:1}

/* ---------- tiles ---------- */
.tiles{display:grid;gap:8px}.t2{grid-template-columns:1fr 1fr}.t3{grid-template-columns:repeat(3,1fr)}.t4{grid-template-columns:repeat(4,1fr)}
.tile{position:relative;border-radius:7px;background:var(--bg0);border:1px solid var(--line);overflow:hidden;cursor:pointer;transition:transform .18s var(--ease),border-color .15s,box-shadow .18s;display:flex;flex-direction:column}
.tile:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:0 6px 16px rgba(0,0,0,.35)}
.tile.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac),0 6px 16px rgba(0,0,0,.35);transform:translateY(-2px)}
.tile .tt{font-size:10.5px;color:var(--tx2);padding:5px 6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile canvas,.tile img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.tile.cks{background:#e8e6e1;background-image:linear-gradient(45deg,#d6d3cc 25%,transparent 25%,transparent 75%,#d6d3cc 75%),linear-gradient(45deg,#d6d3cc 25%,transparent 25%,transparent 75%,#d6d3cc 75%);background-size:12px 12px;background-position:0 0,6px 6px}
.tile.st{background:#f1eee8}.tile.st img{padding:10px;aspect-ratio:1;object-fit:contain}
.tile .x{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}
.tile:hover .x{display:flex}
.fontrow{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 14px;border-radius:7px;font-size:20px;cursor:pointer;transition:background .15s;color:var(--tx)}
.fontrow:hover{background:var(--bg3)}.fontrow small{font:500 10.5px var(--ui);color:var(--tx3)}.fontrow.on{background:var(--acbg)}
.drop-z{border:1.5px dashed var(--line2);border-radius:10px;padding:20px 14px;text-align:center;color:var(--tx2);cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:8px}
.drop-z:hover,.drop-z.over{border-color:var(--ac);background:var(--acbg);color:var(--tx)}
.big-btn{display:flex;align-items:center;width:100%;text-align:left;padding:12px 14px;border-radius:8px;background:var(--bg3);border:1px solid var(--line);transition:all .15s;margin-bottom:8px}
.big-btn:hover{background:var(--bg4);border-color:var(--line2);transform:translateX(2px)}
.fxcard{background:var(--bg0);border:1px solid var(--line);border-radius:8px;padding:11px 12px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s}
.fxcard.on{border-color:rgba(220,20,60,.55)}
.fxcard .ft{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:12.5px}
.fxcard .dot{width:7px;height:7px;border-radius:50%;background:var(--bg4);transition:background .2s}.fxcard.on .dot{background:var(--ac)}
/* layers */
.lay{display:flex;align-items:center;gap:9px;height:46px;padding:0 8px 0 10px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s;position:relative}
.lay:hover{background:var(--bg3)}.lay.on{background:var(--acbg)}.lay.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--ac)}
.lay.dragover{box-shadow:inset 0 2px 0 var(--ac)}.lay.dragging{opacity:.35}
.lay .th{width:30px;height:30px;border-radius:4px;background:var(--bg0);border:1px solid var(--line);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.lay .th img,.lay .th canvas{width:100%;height:100%;object-fit:cover}
.lay .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.lay.off .nm{opacity:.45}
.lay .btn{width:26px;height:26px;color:var(--tx3)}.lay .btn:hover{color:var(--tx)}.lay .btn.act{color:var(--ac2)}

/* ---------- overlays ---------- */
.menu{position:fixed;z-index:200;min-width:200px;background:var(--bg2);border:1px solid var(--line2);border-radius:9px;box-shadow:0 14px 40px rgba(0,0,0,.5);padding:5px;animation:menuin .18s var(--ease);transform-origin:top right}
@keyframes menuin{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.menu button{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border-radius:5px;text-align:left;color:var(--tx)}
.menu button:hover{background:var(--bg4)}.menu button small{margin-left:auto;color:var(--tx3);font-size:11px}
.menu hr{border:0;height:1px;background:var(--line);margin:4px 2px}
.mbg{position:fixed;inset:0;z-index:150;background:rgba(6,6,8,.62);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.6);width:min(460px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;animation:modalin .28s var(--ease);color:var(--tx)}
.modal.wide{width:min(760px,100%)}
@keyframes modalin{from{opacity:0;transform:translateY(14px) scale(.97)}}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;font-size:16px;font-weight:600}
.modal-b{padding:4px 18px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:300;pointer-events:none}
.toast{background:#f4f2ee;color:#18171a;padding:9px 14px;border-radius:8px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:toastin .3s var(--ease);display:flex;gap:8px;align-items:center;max-width:90vw}
.toast.err{background:#ffd9cf;color:#5a1606}.toast.out{opacity:0;transform:translateY(8px);transition:all .3s}
@keyframes toastin{from{opacity:0;transform:translateY(12px) scale(.96)}}

async function decode(blob) {

  catch (e) {
    return await new Promise((res, rej) => { const u = URL.createObjectURL(blob), i = new Image(); i.onload = () => { const c = mkCanvas(i.naturalWidth, i.naturalHeight); c.getContext('2d').drawImage(i, 0, 0); URL.revokeObjectURL(u); res(c); }; i.onerror = () => { URL.revokeObjectURL(u); rej(new Error('decode')); }; i.src = u; });
  }
}
const toBlob = (c, type, q) => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('encode')), type, q));
L.toBlob = toBlob;
L.loadAsset = async (blob, name, id) => {

  let bmp = await decode(blob), w = bmp.width, hh = bmp.height, store = blob; const MAX = 4096;
  if (!w || !hh) throw new Error('empty');

    const s = MAX / Math.max(w, hh), c = mkCanvas(w * s, hh * s), x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(bmp, 0, 0, c.width, c.height);
    bmp.close && bmp.close(); store = await toBlob(c, blob.type === 'image/png' ? 'image/png' : 'image/jpeg', .95); bmp = c; w = c.width; hh = c.height;
  }

  const tx = tc.getContext('2d'); tx.imageSmoothingQuality = 'high'; tx.drawImage(bmp, 0, 0, tc.width, tc.height);
  const a = { id: id || uid(), name: name || 'image', w, h: hh, bmp, blob: store, thumb: tc.toDataURL('image/jpeg', .82), stored: !!id && !!L._loadingFromDB };
  S.assets.set(a.id, a); L.emit('assets'); return a;
};

  }

};

const DB = L.DB = {

  open() { return this.db ? Promise.resolve(this.db) : new Promise((res, rej) => { if (!window.indexedDB) return rej(new Error('Storage unavailable')); const r = indexedDB.open('lumo-studio', 1); r.onupgradeneeded = () => { r.result.createObjectStore('projects', { keyPath: 'id' }); r.result.createObjectStore('assets', { keyPath: 'id' }); }; r.onsuccess = () => { this.db = r.result; res(r.result); }; r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked')); }); },

  put(s, v) { return this.tx(s, 'readwrite', st => st.put(v)); }, get(s, k) { return this.tx(s, 'readonly', st => st.get(k)); },
  del(s, k) { return this.tx(s, 'readwrite', st => st.delete(k)); }, all(s) { return this.tx(s, 'readonly', st => st.getAll()); }
};

/* ---------- collage layouts: cells are [x,y,w,h,rot?] in 0..1 content space ---------- */
const rows = n => Array.from({ length: n }, (_, i) => [0, i / n, 1, 1 / n]);
const cols = n => Array.from({ length: n }, (_, i) => [i / n, 0, 1 / n, 1]);
const grid = (c, r) => Array.from({ length: c * r }, (_, i) => [(i % c) / c, Math.floor(i / c) / r, 1 / c, 1 / r]);
const LAY = L.LAYOUTS = [];
